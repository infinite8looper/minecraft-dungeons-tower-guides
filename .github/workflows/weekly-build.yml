name: Weekly tower guide build

on:
  schedule:
    # Monday 05:10 UTC = just after the Sunday-night tower rollover in the US
    - cron: "10 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Refresh data from the community spreadsheet
        # the committed snapshot is used if the sheet is unreachable
        continue-on-error: true
        run: python scripts/fetch_data.py
      - name: Fetch any newly needed icons
        continue-on-error: true
        run: python scripts/fetch_assets.py
      - run: python -m pytest tests/ -q
      - run: python scripts/build_pdf.py
      - name: Commit updated guide
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Weekly rebuild: tower guide for week of $(date -u +%Y-%m-%d)"
          git push
